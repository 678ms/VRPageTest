<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Multi-Marker AR Animation Controller</title>

  <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: sans-serif;
    }

    #start-menu {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(15, 15, 20, 0.95);
      z-index: 99999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #fff;
      text-align: center;
      padding: 20px;
      box-sizing: border-box;
    }

    #start-menu h1 {
      margin-bottom: 10px;
      font-size: 28px;
    }

    #start-menu p {
      margin-bottom: 25px;
      color: #ccc;
      max-width: 400px;
      line-height: 1.5;
    }

    .start-btn {
      padding: 15px 35px;
      background: #007bff;
      color: #fff;
      border: none;
      border-radius: 30px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0, 123, 255, 0.4);
      transition: all 0.2s ease;
    }

    .start-btn:hover {
      background: #0056b3;
      transform: scale(1.05);
    }

    .ui-container {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      display: none;
      gap: 10px;
      pointer-events: auto;
    }

    .marker-controls {
      display: none;
      gap: 10px;
    }

    .anim-btn {
      padding: 12px 20px;
      background: rgba(0, 0, 0, 0.75);
      color: #fff;
      border: 2px solid #fff;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      font-size: 14px;
    }

    .anim-btn:hover {
      background: #fff;
      color: #000;
    }

    .marker-name {
      position: fixed;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      display: none;
      padding: 8px 14px;
      background: rgba(0, 0, 0, 0.7);
      color: #fff;
      border-radius: 6px;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div id="start-menu">
    <h1>Multi-Marker WebAR</h1>

    <p>
      Arahkan kamera Anda ke marker
      <b>Hiro</b> atau <b>Kanji</b>
      setelah menekan tombol di bawah
      untuk melihat animasi 3D.
    </p>

    <button
      id="start-button"
      class="start-btn"
      onclick="startExperience()">
      Start AR
    </button>
  </div>

  <div id="marker-name" class="marker-name"></div>

  <div id="animation-controls" class="ui-container">

    <div id="tts-controls" class="marker-controls">
      <button
        class="anim-btn"
        onclick="triggerAnimation('Running')">
        Idle
      </button>

      <button
        class="anim-btn"
        onclick="triggerAnimation('All_Night_Dance')">
        Walk
      </button>

      <button
        class="anim-btn"
        onclick="triggerAnimation('Boom_Dance')">
        Dance
      </button>
    </div>

    <div id="freddy-controls" class="marker-controls">
      <button
        class="anim-btn"
        onclick="triggerAnimation('Freddy_Golden--Idle')">
        Idle
      </button>

      <button
        class="anim-btn"
        onclick="triggerAnimation('Freddy_Golden--Charge')">
        Walk
      </button>

      <button
        class="anim-btn"
        onclick="triggerAnimation('Freddy_Golden--Jumpscare_Tuned')">
        Head
      </button>
    </div>

  </div>

  <a-scene
    embedded
    arjs="sourceType: webcam; debugUIEnabled: false;">

    <a-assets>

      <a-asset-item
        id="tts-model"
        src="assets/tts.glb">
      </a-asset-item>

      <a-asset-item
        id="freddy-model"
        src="assets/freddy.glb">
      </a-asset-item>

      <audio
        id="tts-music"
        src="assets/tts-theme.mp3"
        preload="auto"
        loop>
      </audio>

      <audio
        id="freddy-music"
        src="assets/freddy-theme.mp3"
        preload="auto"
        loop>
      </audio>

    </a-assets>

    <a-marker
      type="pattern"
      preset="hiro"
      id="marker-tts"
      marker-handler="
        audioId: #tts-music;
        controlsId: #tts-controls;
        name: The Tung;
      ">

      <a-entity
        id="tts-model-entity"
        gltf-model="#tts-model"
        scale="0.5 0.5 0.5"
        animation-mixer="loop: repeat;">
      </a-entity>

    </a-marker>

    <a-marker
      type="pattern"
      preset="kanji"
      id="marker-freddy"
      marker-handler="
        audioId: #freddy-music;
        controlsId: #freddy-controls;
        name: Freddy;
      ">

      <a-entity
        id="freddy-model-entity"
        gltf-model="#freddy-model"
        scale="0.5 0.5 0.5"
        animation-mixer="loop: repeat;">
      </a-entity>

    </a-marker>

    <a-entity camera></a-entity>

  </a-scene>

  <script>
    let activeModelEl = null;
    let activeMarkerEl = null;
    let activeMusic = null;
    let activeControls = null;

    const animationControls =
      document.getElementById('animation-controls');

    const markerName =
      document.getElementById('marker-name');

    const startMenu =
      document.getElementById('start-menu');

    function startExperience() {
      startMenu.style.display = 'none';

      hideControls();

      const audioElements =
        document.querySelectorAll('audio');

      audioElements.forEach(function(audio) {
        audio.play()
          .then(function() {
            audio.pause();
            audio.currentTime = 0;
          })
          .catch(function() {});
      });
    }

    function hideControls() {
      animationControls.style.display = 'none';

      document
        .querySelectorAll('.marker-controls')
        .forEach(function(element) {
          element.style.display = 'none';
        });

      markerName.style.display = 'none';
    }

    function showControls(controlsElement, name) {
      hideControls();

      animationControls.style.display = 'flex';

      controlsElement.style.display = 'flex';

      markerName.textContent = name;
      markerName.style.display = 'block';

      activeControls = controlsElement;
    }

    function triggerAnimation(animationName) {
      if (!activeModelEl) {
        return;
      }

      activeModelEl.setAttribute(
        'animation-mixer',
        clip: ${animationName}; loop: repeat; clampWhenFinished: true;
      );
    }

    AFRAME.registerComponent('marker-handler', {
      schema: {
        audioId: {
          type: 'selector'
        },

        controlsId: {
          type: 'selector'
        },

        name: {
          type: 'string'
        }
      },

      init: function() {
        const marker = this.el;

        const modelEl =
          marker.querySelector('[gltf-model]');

        const music =
          this.data.audioId;

        const controls =
          this.data.controlsId;

        marker.addEventListener(
          'markerFound',
          () => {

            activeMarkerEl = marker;
            activeModelEl = modelEl;
            activeMusic = music;

            if (controls) {
              showControls(
                controls,
                this.data.name
              );
            }

            document
              .querySelectorAll('audio')
              .forEach(function(audio) {

                if (audio !== music) {
                  audio.pause();
                  audio.currentTime = 0;
                }

              });

            if (music) {
              music.play()
                .catch(function(error) {
                  console.log(
                    'Audio play error:',
                    error
                  );
                });
            }

          }
        );

        marker.addEventListener(
          'markerLost',
          () => {

            if (activeMarkerEl === marker) {
              activeMarkerEl = null;
              activeModelEl = null;
              activeMusic = null;
              activeControls = null;

              hideControls();
            }

            if (music) {
              music.pause();
              music.currentTime = 0;
            }

          }
        );
      }
    });
  </script>

</body>
</html>
