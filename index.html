<!DOCTYPE html>
<html>
<head>
    <title>Multi-Marker AR Animation Controller</title>
    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <script src="Command.js"></script>

  <style>
    .ui-container {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      display: flex;
      gap: 10px;
    }
    .anim-btn {
      padding: 12px 20px;
      background: rgba(0, 0, 0, 0.7);
      color: white;
      border: 2px solid #fff;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }
    .anim-btn:hover { background: rgba(255, 255, 255, 0.9); color: black; }
  </style>
</head>

<body style="margin: 0; overflow: hidden;">

  <!-- HTML UI Overlay -->
  <div class="ui-container">
    <button class="anim-btn" onclick="triggerAnimation('Idle')">Animation 1 (Idle)</button>
    <button class="anim-btn" onclick="triggerAnimation('Walk')">Animation 2 (Walk)</button>
    <button class="anim-btn" onclick="triggerAnimation('Jump')">Animation 3 (Jump)</button>
  </div>

  <!-- AR Scene -->
  <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
    
    <a-assets>
      <a-asset-item id="tts-model" src="assets/tts.glb"></a-asset-item>
      <a-asset-item id="monster-model" src="assets/monster.glb"></a-asset-item>
      
      <!-- Add your audio files here -->
      <audio id="tts-music" src="assets/tts-theme.mp3" preload="auto" loop></audio>
      <audio id="monster-music" src="assets/monster-theme.mp3" preload="auto" loop></audio>
    </a-assets>

    <!-- MARKER 1: Hiro Marker (Linked to tts music) -->
    <a-marker type="pattern" preset="hiro" id="marker-tts" gltf-model="##tts-model" marker-handler="audioId: #tts-music">
      <a-gltf-model id="magic-box" src="#tts-model" position="0 0 -3" scale="0.5 0.5 0.5" animation="property: rotation; to: 0 360 0; loop: true; dur: 3000; easing: linear;" ></a-gltf-model>
    </a-marker>

    <a-marker type="pattern" preset="kanji" id="marker-monster" marker-handler="audioId: #monster-music">

    </a-marker>


    
  </a-scene>


  <script>
    let activeModelEl = null;

    AFRAME.registerComponent('marker-handler', {
      // Define a schema so you can pass different audio IDs to each marker
      schema: {
        audioId: { type: 'selector' }
      },
      
      init: function () {
        const marker = this.el;
        const modelEl = marker.querySelector('[gltf-model]');
        const music = this.data.audioId;

        marker.addEventListener('markerFound', () => {
          activeModelEl = modelEl; 
          
          // Play the music tied to this marker
          if (music) {
            music.play().catch(error => {
              console.log("Audio autoplay blocked. Ensure you interact with the screen first.", error);
            });
          }
        });

        marker.addEventListener('markerLost', () => {
          if (activeModelEl === modelEl) {
            activeModelEl = null;
          }
          
          // Pause the music and reset its track timeline when tracking is lost
          if (music) {
            music.pause();
            music.currentTime = 0; 
          }
        });
      }
    });

    function triggerAnimation(clipName) {
      if (activeModelEl) {
        activeModelEl.setAttribute('animation-mixer', {
          clip: clipName,
          loop: 'repeat'
        });
      } else {
        alert("Please scan an AR marker first!");
      }
    }
  </script> 
</body>
</html>
