<!DOCTYPE html>
<html>
<head>
  <title>Multi-Marker AR Animation Controller</title>
  <script src="https://aframe.io"></script>
  <script src="https://githack.com"></script>
  <script src="https://jsdelivr.net"></script>

  <style>
    .ui-container {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      display: flex;
      gap: 10px;
    }
    .anim-btn {
      padding: 12px 20px;
      background: rgba(0, 0, 0, 0.7);
      color: white;
      border: 2px solid #fff;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }
    .anim-btn:hover { background: rgba(255, 255, 255, 0.9); color: black; }
  </style>
</head>

<body style="margin: 0; overflow: hidden;">

  <!-- HTML UI Overlay -->
  <div class="ui-container">
    <button class="anim-btn" onclick="triggerAnimation('Idle')">Animation 1 (Idle)</button>
    <button class="anim-btn" onclick="triggerAnimation('Walk')">Animation 2 (Walk)</button>
    <button class="anim-btn" onclick="triggerAnimation('Jump')">Animation 3 (Jump)</button>
  </div>

  <!-- AR Scene -->
  <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
    
    <a-assets>
      <a-asset-item id="robot-model" src="robot.glb"></a-asset-item>
      <a-asset-item id="monster-model" src="monster.glb"></a-asset-item>
    </a-assets>

    <!-- MARKER 1: Hiro Marker -->
    <a-marker type="pattern" preset="hiro" id="marker-robot" marker-handler>
      
      
    </a-marker>

    <!-- MARKER 2: Kanji Marker -->
    <a-marker type="pattern" preset="kanji" id="marker-monster" marker-handler>
      
      
    </a-marker>

    
  </a-scene>

  <script>
    // Global variable to track which model is currently scanned/visible
    let activeModelEl = null;

    // A-Frame Component to track when a marker enters or leaves the camera view
    AFRAME.registerComponent('marker-handler', {
      init: function () {
        const marker = this.el;
        // Find the 3D model nested inside this marker
        const modelEl = marker.querySelector('[gltf-model]');

        marker.addEventListener('markerFound', () => {
          activeModelEl = modelEl; 
          console.log("Active model set to:", modelEl.id);
        });

        marker.addEventListener('markerLost', () => {
          if (activeModelEl === modelEl) {
            activeModelEl = null; // Clear if the active one is lost
          }
        });
      }
    });

    // Function triggered by the HTML button clicks
    function triggerAnimation(clipName) {
      if (activeModelEl) {
        // Dynamically update the clip attribute of the animation-mixer
        activeModelEl.setAttribute('animation-mixer', {
          clip: clipName,
          loop: 'repeat'
        });
        console.log(`Playing "${clipName}" on ${activeModelEl.id}`);
      } else {
        alert("Please scan an AR marker first!");
      }
    }
  </script>
</body>
</html>
