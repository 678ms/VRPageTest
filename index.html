<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Multi-Marker AR Animation Controller (Persistent Models)</title>
  
  <!-- A-Frame and AR.js Libraries -->
  <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>
  
  <!-- NippleJS for Virtual Joystick -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/nipplejs/0.10.1/nipplejs.min.js"></script>

  <!-- Tailwind CSS for UI components -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    /* Custom reset and AR layout overrides */
    body {
      margin: 0;
      overflow: hidden;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      background-color: #090d16;
    }

    /* Glassmorphism styling for floating HUD components */
    .glass-panel {
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.45);
    }

    .anim-btn {
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
    }

    .anim-btn:active {
      transform: scale(0.95);
    }

    .anim-btn::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(120deg, transparent, rgba(255,255,255,0.25), transparent);
      transform: translateX(-100%);
    }

    .anim-btn:hover::after {
      transform: translateX(100%);
      transition: transform 0.6s;
    }

    /* Joystick Zone Styling */
    #joystick-zone {
      position: fixed;
      bottom: 24px;
      right: 24px;
      width: 120px;
      height: 120px;
      z-index: 9999;
      display: none;
      pointer-events: auto;
      touch-action: none;
    }

    /* Video element transition */
    .arjs-video {
      opacity: 0;
      transition: opacity 0.5s ease-in-out;
    }

    .ar-active .arjs-video {
      opacity: 1;
    }
  </style>
</head>

<body>
  <!-- Start Menu / Splash Overlay -->
  <div id="start-menu" class="fixed inset-0 z-[10000] flex flex-col items-center justify-center p-6 bg-slate-950 text-white transition-opacity duration-500">
    <div class="absolute w-72 h-72 bg-cyan-500/20 rounded-full blur-3xl -top-10 -left-10 pointer-events-none"></div>
    <div class="absolute w-72 h-72 bg-indigo-500/20 rounded-full blur-3xl -bottom-10 -right-10 pointer-events-none"></div>

    <div class="relative max-w-md w-full glass-panel p-8 rounded-2xl flex flex-col items-center text-center space-y-6 border border-slate-700/50 shadow-2xl">
      <div class="w-20 h-20 bg-gradient-to-tr from-cyan-500 to-indigo-600 rounded-2xl flex items-center justify-center shadow-lg shadow-cyan-500/30">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-10 h-10 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 10l-2 1m0 0l-2-1m2 1v2.5M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4" />
        </svg>
      </div>

      <div>
        <h1 class="text-2xl font-bold tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-indigo-300">
          AR ANIMATION LAB
        </h1>
        <p class="text-xs text-slate-400 uppercase tracking-widest mt-1">Multi-Marker Persistent AR</p>
      </div>

      <p class="text-sm text-slate-300 leading-relaxed">
        Scan target markers (<span class="text-cyan-400 font-mono font-semibold">Hiro</span> or <span class="text-indigo-400 font-mono font-semibold">Kanji</span>) once to spawn and lock 3D models into AR space. Models remain pinned even after the marker leaves camera view!
      </p>

      <div class="w-full grid grid-cols-2 gap-3 text-xs text-slate-300 pt-2">
        <div class="p-3 bg-slate-800/60 rounded-xl border border-slate-700/50 flex flex-col items-center">
          <svg class="w-5 h-5 mb-1 text-cyan-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 00-2 2z" />
          </svg>
          <span>Camera Access Required</span>
        </div>
        <div class="p-3 bg-slate-800/60 rounded-xl border border-slate-700/50 flex flex-col items-center">
          <svg class="w-5 h-5 mb-1 text-emerald-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
          </svg>
          <span>Auto-Lock Persistence</span>
        </div>
      </div>

      <button id="start-btn" onclick="startApp()" class="w-full py-3.5 px-6 rounded-xl font-bold text-sm tracking-wider uppercase bg-gradient-to-r from-cyan-500 to-indigo-600 hover:from-cyan-400 hover:to-indigo-500 text-white shadow-lg shadow-cyan-500/25 active:scale-95 transition duration-200">
        Start Experience
      </button>
    </div>
  </div>

  <!-- Top Marker Status HUD -->
  <div id="hud-top" class="fixed top-6 left-1/2 -translate-x-1/2 z-[9999] hidden flex-col items-center space-y-2 pointer-events-auto">
    <div id="marker-name" class="px-5 py-2 glass-panel rounded-full text-white font-semibold text-xs tracking-wider uppercase shadow-xl border border-cyan-500/30 flex items-center gap-2">
      <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
      <span id="marker-title-text">Model Active</span>
    </div>
    
    <!-- Rescan / Unlock Button -->
    <button onclick="repositionCurrentModel()" class="px-3 py-1.5 glass-panel rounded-lg text-xs font-medium text-slate-200 hover:text-white border border-slate-600/50 hover:border-cyan-400/60 shadow transition-all active:scale-95 flex items-center gap-1.5">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5 text-cyan-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
      </svg>
      <span>Re-scan Position</span>
    </button>
  </div>

  <!-- Animation Controls HUD -->
  <div id="animation-controls" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-[9999] hidden flex-col items-center pointer-events-auto">
    <div id="tts-controls" class="marker-controls flex gap-2 glass-panel p-2 rounded-2xl border border-cyan-500/20">
      <button class="anim-btn px-4 py-2 bg-slate-800/80 hover:bg-cyan-600 text-white font-semibold text-xs rounded-xl border border-slate-600 hover:border-cyan-400 shadow" onclick="triggerAnimation('Running')">Idle</button>
      <button class="anim-btn px-4 py-2 bg-slate-800/80 hover:bg-cyan-600 text-white font-semibold text-xs rounded-xl border border-slate-600 hover:border-cyan-400 shadow" onclick="triggerAnimation('All_Night_Dance')">Walk</button>
      <button class="anim-btn px-4 py-2 bg-slate-800/80 hover:bg-cyan-600 text-white font-semibold text-xs rounded-xl border border-slate-600 hover:border-cyan-400 shadow" onclick="triggerAnimation('Boom_Dance')">Dance</button>
    </div>

    <div id="freddy-controls" class="marker-controls flex gap-2 glass-panel p-2 rounded-2xl border border-indigo-500/20">
      <button class="anim-btn px-4 py-2 bg-slate-800/80 hover:bg-indigo-600 text-white font-semibold text-xs rounded-xl border border-slate-600 hover:border-indigo-400 shadow" onclick="triggerAnimation('Freddy_Golden--Idle')">Idle</button>
      <button class="anim-btn px-4 py-2 bg-slate-800/80 hover:bg-indigo-600 text-white font-semibold text-xs rounded-xl border border-slate-600 hover:border-indigo-400 shadow" onclick="triggerAnimation('Freddy_Golden--Charge')">Walk</button>
      <button class="anim-btn px-4 py-2 bg-slate-800/80 hover:bg-indigo-600 text-white font-semibold text-xs rounded-xl border border-slate-600 hover:border-indigo-400 shadow" onclick="triggerAnimation('Freddy_Golden--Jumpscare_Tuned')">Head</button>
    </div>
  </div>

  <!-- Joystick Container -->
  <div id="joystick-zone"></div>

  <!-- A-Frame AR Scene -->
  <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;" class="w-full h-full">
    <a-assets>
      <a-asset-item id="tts-model" src="assets/tts.glb"></a-asset-item>
      <a-asset-item id="freddy-model" src="assets/freddy.glb"></a-asset-item>

      <audio id="tts-music" src="assets/tts-theme.mp3" preload="auto" loop></audio>
      <audio id="freddy-music" src="assets/freddy-theme.mp3" preload="auto" loop></audio>
    </a-assets>

    <!-- World Container Entity for holding locked models in persistent space -->
    <a-entity id="world-container"></a-entity>

    <!-- Hiro Marker -->
    <a-marker
      type="pattern"
      preset="hiro"
      id="marker-tts"
      marker-handler="audioId: #tts-music; controlsId: #tts-controls; name: The Tung; modelId: tts-model-entity">

      <a-entity
        id="tts-model-entity"
        gltf-model="#tts-model"
        scale="0.5 0.5 0.5"
        animation-mixer="loop: repeat;"
        model-controller>
      </a-entity>
    </a-marker>

    <!-- Kanji Marker -->
    <a-marker
      type="pattern"
      preset="kanji"
      id="marker-freddy"
      marker-handler="audioId: #freddy-music; controlsId: #freddy-controls; name: Freddy; modelId: freddy-model-entity">

      <a-entity
        id="freddy-model-entity"
        gltf-model="#freddy-model"
        scale="0.5 0.5 0.5"
        animation-mixer="loop: repeat;"
        model-controller>
      </a-entity>
    </a-marker>
    
    <a-entity camera></a-entity>
  </a-scene>

  <script>
    let activeModelEl = null;
    let activeMarkerEl = null;
    let activeMusic = null;
    let activeControls = null;
    let joystickManager = null;
    let appStarted = false;
    let currentMarkerHandler = null;

    // Movement state object
    const moveData = { x: 0, y: 0 };

    const startMenu = document.getElementById('start-menu');
    const animationControls = document.getElementById('animation-controls');
    const hudTop = document.getElementById('hud-top');
    const markerTitleText = document.getElementById('marker-title-text');
    const joystickZone = document.getElementById('joystick-zone');

    function startApp() {
      if (appStarted) return;
      appStarted = true;

      const ttsMusic = document.getElementById('tts-music');
      const freddyMusic = document.getElementById('freddy-music');

      if (ttsMusic) {
        ttsMusic.play().then(() => ttsMusic.pause()).catch(() => {});
      }
      if (freddyMusic) {
        freddyMusic.play().then(() => freddyMusic.pause()).catch(() => {});
      }

      document.body.classList.add('ar-active');

      startMenu.style.opacity = '0';
      setTimeout(() => {
        startMenu.style.display = 'none';
      }, 500);
    }

    // Movement component using local space transform updates
    AFRAME.registerComponent('model-controller', {
      schema: { speed: { type: 'number', default: 0.05 } },
      
      tick: function (time, deltaTime) {
        if (!activeModelEl || activeModelEl !== this.el) return;
        if (moveData.x === 0 && moveData.y === 0) return;

        const currentPosition = this.el.getAttribute('position');
        const moveSpeed = this.data.speed * (deltaTime / 16.6);

        currentPosition.x += moveData.x * moveSpeed;
        currentPosition.z -= moveData.y * moveSpeed;

        this.el.setAttribute('position', currentPosition);

        const angle = Math.atan2(moveData.x, moveData.y);
        this.el.setAttribute('rotation', { x: 0, y: THREE.MathUtils.radToDeg(angle), z: 0 });
      }
    });

    function initJoystick() {
      if (joystickManager) return;

      joystickManager = nipplejs.create({
        zone: joystickZone,
        mode: 'static',
        position: { left: '50%', top: '50%' },
        color: '#38bdf8',
        size: 100
      });

      joystickManager.on('move', (evt, data) => {
        if (data && data.vector) {
          moveData.x = data.vector.x;
          moveData.y = data.vector.y;
        }
      });

      joystickManager.on('end', () => {
        moveData.x = 0;
        moveData.y = 0;
      });
    }

    function hideControls() {
      animationControls.style.display = 'none';
      document.querySelectorAll('.marker-controls').forEach(element => {
        element.style.display = 'none';
      });
      hudTop.style.display = 'none';
      joystickZone.style.display = 'none';
      moveData.x = 0;
      moveData.y = 0;
    }

    function showControls(controlsElement, name) {
      if (!appStarted) return;
      hideControls();
      animationControls.style.display = 'flex';
      controlsElement.style.display = 'flex';
      markerTitleText.textContent = name + ' (Locked)';
      hudTop.style.display = 'flex';
      joystickZone.style.display = 'block';
      activeControls = controlsElement;
      initJoystick();
    }

    function triggerAnimation(animationName) {
      if (!activeModelEl) return;

      activeModelEl.setAttribute(
        'animation-mixer',
        `clip: ${animationName}; loop: repeat; clampWhenFinished: true;`
      );
    }

    // Function to unlock active model so it can be re-scanned/re-pinned
    function repositionCurrentModel() {
      if (!currentMarkerHandler) return;
      currentMarkerHandler.resetLock();
    }

    // Register marker detection component with World Space Model Pinning
    AFRAME.registerComponent('marker-handler', {
      schema: {
        audioId: { type: 'selector' },
        controlsId: { type: 'selector' },
        name: { type: 'string' },
        modelId: { type: 'string' }
      },

      init: function () {
        const marker = this.el;
        const modelEl = document.getElementById(this.data.modelId);
        const music = this.data.audioId;
        const controls = this.data.controlsId;
        const worldContainer = document.getElementById('world-container');

        this.isLocked = false;
        this.originalParent = marker;

        marker.addEventListener('markerFound', () => {
          if (!appStarted) return;

          // Perform initial lock/pinning when detected for the first time
          if (!this.isLocked && modelEl) {
            // Read matrix world of model when marker is tracked
            modelEl.object3D.updateMatrixWorld(true);
            
            // Re-parent model from marker to scene root container so standard AR.js hiding logic doesn't hide it
            worldContainer.object3D.attach(modelEl.object3D);

            this.isLocked = true;
          }

          activeMarkerEl = marker;
          activeModelEl = modelEl;
          activeMusic = music;
          currentMarkerHandler = this;

          if (controls) {
            showControls(controls, this.data.name);
          }

          if (music) {
            music.play().catch(error => {
              console.log('Audio playback blocked:', error);
            });
          }
        });

        this.resetLock = function () {
          if (!modelEl) return;

          // Re-attach model back to original marker element and reset transform
          this.originalParent.object3D.attach(modelEl.object3D);
          modelEl.setAttribute('position', '0 0 0');
          modelEl.setAttribute('rotation', '0 0 0');
          this.isLocked = false;

          if (music) {
            music.pause();
            music.currentTime = 0;
          }

          if (activeMarkerEl === marker) {
            activeMarkerEl = null;
            activeModelEl = null;
            activeMusic = null;
            currentMarkerHandler = null;
            hideControls();
          }
        };
      }
    });
  </script>
</body>
</html>
